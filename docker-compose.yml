services:
  emqx:
    image: emqx/emqx:5.8.3
    container_name: tego_emqx
    restart: unless-stopped
    ports:
      - "1883:1883"              # MQTT
      - "127.0.0.1:18083:18083"  # Dashboard（僅本機）
    environment:
      EMQX_NAME: tego_emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  emqx_data:
  emqx_log:
